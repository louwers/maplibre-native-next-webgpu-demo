<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maplibre-native-next on WebGPU: OpenFreeMap Liberty</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: fixed; inset: 0; background: #f2efe9; }
    #status { position: fixed; top: 12px; left: 12px; max-width: 32em; padding: 8px 12px;
              background: rgba(255, 255, 255, 0.92); border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); }
    #status:empty { display: none; }
    #status.error { color: #b00020; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Loading…</div>
  <script type="module">
    // OpenFreeMap's Liberty style, rendered by maplibre-native-next (the Rust
    // port of MapLibre Native) through @bartlwrs/mln-next-web, which has a
    // trimmed-down MapLibre GL JS API. web/_headers makes the page
    // cross-origin isolated, so the map runs in workers.
    import { Map } from "./vendor/mln-next-web/index.js";

    const statusElement = document.getElementById("status");
    function showStatus(text, isError) {
      statusElement.textContent = text;
      statusElement.className = isError ? "error" : "";
    }

    // navigator.gpu can exist without an adapter: Chromium on Linux renders
    // WebGPU through Vulkan, which it leaves off unless
    // chrome://flags/#enable-vulkan (or --enable-features=Vulkan) turns it on.
    async function problem() {
      if (!navigator.gpu) return "WebGPU isn't available in this browser.";
      if (await navigator.gpu.requestAdapter()) return null;
      const linux = /Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent);
      return "WebGPU found no GPU adapter." + (linux
        ? " On Linux, Chromium needs Vulkan: enable chrome://flags/#enable-vulkan and restart the browser."
        : "");
    }

    function start() {
      const map = new Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/liberty",
        center: [4.9041, 52.3676],
        zoom: 12.5,
        attributionControl: {
          customAttribution: 'Rendered by <a href="https://github.com/louwers/maplibre-native-next">maplibre-native-next</a> on WebGPU',
        },
      });
      map.on("load", () => showStatus(""));
      map.on("error", (event) => showStatus(event.error?.message ?? String(event.error), true));
      window.map = map;
    }

    problem().then((message) => (message ? showStatus(message, true) : start()));
  </script>
</body>
</html>
