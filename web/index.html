<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>maplibre-native-next on WebGPU: OpenFreeMap Liberty</title>
  <style>
    /* The map fills the screen, notch areas included (viewport-fit=cover),
       and the page itself never zooms, scrolls or bounces: pinches and drags
       anywhere go to the map. */
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif;
                 touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #view { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: #f2efe9; }
    #view:active { cursor: grabbing; }
    /* One canvas pixel per device pixel, centered, at any window size: the
       box is the view in device pixels, scaled back down, and object-fit:
       none never scales the frame. The map renders in a worker, so a resize
       changes the box a frame or two before the frame at the new size
       arrives. Meanwhile the previous frame keeps its size and position
       instead of stretching. */
    canvas { position: absolute; left: 50%; top: 50%;
             width: calc(100vw * var(--dpr, 1)); height: calc(100vh * var(--dpr, 1));
             transform: translate(-50%, -50%) scale(calc(1 / var(--dpr, 1)));
             object-fit: none; pointer-events: none; }
    #status { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); max-width: 32em; padding: 8px 12px;
              background: rgba(255, 255, 255, 0.92); border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); }
    #status:empty { display: none; }
    #status.error { color: #b00020; }
    #attribution { position: fixed; right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom);
                   padding: 2px 6px; font-size: 12px;
                   background: rgba(255, 255, 255, 0.8); }
  </style>
</head>
<body>
  <div id="view"><canvas id="map"></canvas></div>
  <div id="status">Loading…</div>
  <div id="attribution">
    <span id="style-credit"><a href="https://openfreemap.org">OpenFreeMap</a>
    © <a href="https://www.openmaptiles.org/">OpenMapTiles</a>
    Data from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
    ·</span> Rendered by <a href="https://github.com/louwers/maplibre-native-next">maplibre-native-next</a>
    on WebGPU
  </div>
  <script>
    const view = document.getElementById("view");
    const statusElement = document.getElementById("status");

    function showStatus(text, isError) {
      statusElement.textContent = text;
      statusElement.className = isError ? "error" : "";
    }

    function unsupported() {
      if (!window.crossOriginIsolated) return "This page needs cross-origin isolation (the Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers in web/_headers).";
      if (!navigator.gpu) return "WebGPU isn't available in this browser.";
      if (typeof WebAssembly.Suspending !== "function") return "This page needs WebAssembly JavaScript Promise Integration (JSPI), as in Chrome or Edge 137 and newer, or Safari 27 and newer.";
      return null;
    }

    // ?style=<URL> loads another style than OpenFreeMap's Liberty. Its
    // server must allow CORS, as the page is cross-origin isolated.
    const style = new URLSearchParams(location.search).get("style");
    if (style) document.getElementById("style-credit").remove();

    let ready = false;
    function start() {
      const ratio = window.devicePixelRatio || 1;
      document.documentElement.style.setProperty("--dpr", String(ratio));
      const args = [String(view.clientWidth), String(view.clientHeight), String(ratio)];
      if (style) args.push(new URL(style, location.href).href);
      window.Module = {
        arguments: args,
        showStatus,
        print: (text) => console.log(text),
        printErr: (text) => console.warn(text),
        onRuntimeInitialized: () => { ready = true; },
        onAbort: (reason) => showStatus("The map stopped: " + reason, true),
      };
      const script = document.createElement("script");
      script.src = "demo.js";
      document.body.appendChild(script);

      // Pointers on the map by id, in CSS pixels of the view: one drags the
      // map, two pinch it. The gesture follows their center and, with two,
      // their distance.
      const pointers = new Map();
      let gesture = null;
      const local = (event) => {
        const rect = view.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      };
      const center = (points) => ({
        x: points.reduce((sum, p) => sum + p.x, 0) / points.length,
        y: points.reduce((sum, p) => sum + p.y, 0) / points.length,
      });
      const distance = ([a, b]) => Math.hypot(a.x - b.x, a.y - b.y);
      // Starts over from the pointers down now, when one is added or lifted.
      function restartGesture() {
        const points = [...pointers.values()];
        gesture = points.length === 0 ? null
          : { ...center(points), distance: points.length >= 2 ? distance(points) : 0 };
      }
      view.addEventListener("pointerdown", (event) => {
        view.setPointerCapture(event.pointerId);
        pointers.set(event.pointerId, local(event));
        restartGesture();
      });
      view.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return;
        pointers.set(event.pointerId, local(event));
        if (!ready || !gesture) return;
        const points = [...pointers.values()];
        const now = center(points);
        Module._demo_pan(now.x - gesture.x, now.y - gesture.y);
        if (points.length >= 2) {
          const spread = distance(points);
          if (gesture.distance > 0 && spread > 0) Module._demo_zoom(Math.log2(spread / gesture.distance), now.x, now.y);
          gesture.distance = spread;
        }
        gesture.x = now.x;
        gesture.y = now.y;
      });
      const lift = (event) => {
        pointers.delete(event.pointerId);
        restartGesture();
      };
      view.addEventListener("pointerup", lift);
      view.addEventListener("pointercancel", lift);
      view.addEventListener("wheel", (event) => {
        event.preventDefault();
        if (!ready) return;
        const { x, y } = local(event);
        if (event.ctrlKey) {
          // A trackpad pinch in Chrome, Edge and Firefox: the page would zoom
          // by a factor of exp(-deltaY / 100).
          Module._demo_zoom(-event.deltaY / 100 * Math.LOG2E, x, y);
        } else {
          const lines = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 40 : 1;
          Module._demo_zoom(-event.deltaY * lines / 400, x, y);
        }
      }, { passive: false });
      // A trackpad pinch in Safari on macOS: gesture events with the scale
      // since the pinch began. On iOS a pinch sends them too, beside the
      // pointer events that already zoom.
      let gestureScale = 1;
      document.addEventListener("gesturestart", (event) => {
        event.preventDefault();
        gestureScale = 1;
      });
      document.addEventListener("gesturechange", (event) => {
        event.preventDefault();
        if (!ready || pointers.size > 0 || !(event.scale > 0)) return;
        const { x, y } = local(event);
        Module._demo_zoom(Math.log2(event.scale / gestureScale), x, y);
        gestureScale = event.scale;
      });
      document.addEventListener("gestureend", (event) => event.preventDefault());
      view.addEventListener("dblclick", (event) => {
        if (!ready) return;
        const { x, y } = local(event);
        Module._demo_zoom(1, x, y);
      });
      window.addEventListener("resize", () => {
        if (ready) Module._demo_resize(view.clientWidth, view.clientHeight);
      });
    }

    // navigator.gpu can exist without an adapter: Chromium on Linux renders
    // WebGPU through Vulkan, which it leaves off unless chrome://flags/#enable-vulkan
    // (or --enable-features=Vulkan) turns it on.
    async function noAdapter() {
      if (await navigator.gpu.requestAdapter()) return null;
      const linux = /Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent);
      return "WebGPU found no GPU adapter." + (linux
        ? " On Linux, Chromium needs Vulkan: enable chrome://flags/#enable-vulkan and restart the browser."
        : "");
    }

    const problem = unsupported();
    if (problem) showStatus(problem, true);
    else noAdapter().then((message) => message ? showStatus(message, true) : start());
  </script>
</body>
</html>
